[build-system]
requires = ["hatchling~=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent_codemode"
authors = [{ name = "Datalayer", email = "info@datalayer.io" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Jupyter", "AI", "MCP", "Model Context Protocol"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "agent_skills",
    "code_sandboxes",
    "mcp[cli]>=1.0",
    "pydantic>=2.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
pydantic-ai = [
  "pydantic-graph>=1.94.0",
  "pydantic-ai-slim>=1.94.0",
]
test = [
  "ipykernel",
  "jupyter_server>=1.6,<3",
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "pytest-cov>=4.1",
]
lint = ["mdformat>0.7", "mdformat-gfm>=0.3.5", "ruff"]
typing = ["mypy>=0.990"]

[project.license]
file = "LICENSE"

[project.urls]
Home = "https://github.com/datalayer/agent-codemode"

[tool.hatch.version]
path = "agent_codemode/__version__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:There is no current event loop:DeprecationWarning",
  "module:make_current is deprecated:DeprecationWarning",
  "module:clear_current is deprecated:DeprecationWarning",
  "module:Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning",
]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true
show_error_context = true
show_error_codes = true
strict_equality = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C",
  "E",
  "F",
  "FBT",
  "I",
  "N",
  "Q",
  "RUF",
  "S",
  "T",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # FBT001 Boolean positional arg in function definition
  "FBT001",
  "FBT002",
  "FBT003",
]

[tool.ruff.lint.per-file-ignores]
# S101 Use of `assert` detected
"tests/*" = ["S101"]
"tests/test_stdout_capture.py" = ["S101", "T201", "E501"]
"tests/test_direct_execution.py" = ["T201"]
"tests/test_executor_async.py" = ["T201"]
"tests/test_skill_bindings.py" = ["S102", "F841"]
"tests/test_agent_minimal.py" = ["T201"]
"tests/test_codemode.py" = ["E731", "E501"]
"skills/**/scripts/*.py" = ["E501", "C901", "T201", "RUF013", "E741"]
"examples/skills/skills/**/scripts/*.py" = ["E501", "C901", "T201", "RUF013", "E741"]
"examples/**/*.py" = ["T201", "S108", "S311", "UP007", "E501", "C901", "E741", "RUF013", "S110", "C408", "F841", "F821"]
"agent_codemode/toolset.py" = ["UP007", "E501", "C901"]
"agent_codemode/types.py" = ["UP007"]
"agent_codemode/proxy/mcp_client.py" = ["S110"]
"agent_codemode/proxy/meta_tools.py" = ["UP007"]
"agent_codemode/tool_definitions.py" = ["E501"]
"agent_codemode/discovery/codegen.py" = ["RUF001", "RUF002", "E501", "B007", "E402"]
"agent_codemode/composition/executor.py" = ["E501", "S108", "C901", "S102", "T201", "B007"]
